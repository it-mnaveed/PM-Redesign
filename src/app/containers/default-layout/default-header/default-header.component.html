<ng-container>
  <c-container [fluid]="true">
    <button toggle="visible" cHeaderToggler [cSidebarToggle]="sidebarId" class="ps-1">
      <svg cIcon name="cilMenu" size="lg"></svg>
    </button>

    <c-header-nav class=" d-lg-flex me-auto header-nav" _nghost-ng-c1721759406="" role="navigation">
      <c-nav-item _nghost-ng-c3971377937="" class="nav-item">

        <a cNavLink routerLink="/dashboard" routerLinkActive="active">
          Welcome, {{UserFullName}}
        </a>
        <div class="header-inline-data">
          <c-breadcrumb-router class="ms-2"></c-breadcrumb-router>
          <p>{{CUrrentDate}}</p>

        </div>

      </c-nav-item>
    </c-header-nav>
    <c-header-nav class="d-lg-flex align-items-center">

      <div class="d-flex justify-content-end align-items-center lng-btn">

        <!-- Theme toggle is hidden by default because the purple scheme is the app default. -->
        <button *ngIf="showThemeToggle" class="btn theme-toggle me-2 d-flex align-items-center" type="button" (click)="toggleTheme()" aria-label="Toggle theme">
          <i [ngClass]="isPurpleTheme ? 'fa-solid fa-sun' : 'fa-regular fa-moon'"></i>
        </button>

        <div class="langDropdown d-flex align-items-center">

          <span class="fi fi-gb"></span>
          <span [ngClass]="{
      'fi fi-gb': currentLang === 'en',
      'fi fi-sa': currentLang === 'ar'
    }"></span>

          <select class="form-select border-0 w-auto custom-select" [(ngModel)]="currentLang"
            (change)="switchLang(currentLang)">
            <option value="en">English</option>
            <option value="ar">Arabic</option>
          </select>
        </div>

      </div>
      <c-nav-item>
        <a routerLink="/approvals/pending-documents" cNavLink class="bellIcon">

          <i class="fa-regular fa-bell"></i>
          <!-- <svg cIcon name="cilBell" size="lg"></svg> -->
          <!-- <img src="../../../../assets/images/bell-icon.png"> -->
          <span class="countSe">{{PendingDocumentList ?? 0}}</span>
        </a>
      </c-nav-item>

      <ng-container *ngTemplateOutlet="userDropdown"></ng-container>

      <div class="nameRole">
        <h4 class="userName">{{UserFullName}}.</h4>
        <p>{{UserType}}</p>
      </div>
    </c-header-nav>

  <c-dropdown alignment="end" variant="nav-item" class="u-spacing">

    <button cButton color="" [caret]="false" cDropdownToggle class="py-0 avatar-button-custom">
      <c-avatar *ngIf="UserImage" shape="rounded-1" size="md" [src]="UserImage" status="success">
      </c-avatar>
      <div *ngIf="!UserImage" class="avatar-initials" [style.background]="getAvatarColor(UserFullName)">
        {{ getUserInitials(UserFullName) }}
      </div>
    </button>
    <ul cDropdownMenu class="pt-0 w-auto">
      <li>
        <h6 cDropdownHeader class="fw-semibold py-2 rounded-top" style="background-color: #F2F2F2;">
          Account
        </h6>
      </li>
      <li (click)="LogOut()" class="clickable">
        <a cDropdownItem>
          <svg cIcon class="me-2" name="cilAccountLogout"></svg>
          Logout
        </a>
      </li>
      <li></li>
    </ul>
  </c-dropdown>
